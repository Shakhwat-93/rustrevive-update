# Production Application Docker Compose
# Stateless Application Container (Safe to rebuild, restart, or recreate)
services:
  web:
    image: ghcr.io/rustrevive/web:latest
    container_name: rustrevive-web-prod
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - /opt/rustrevive/app/.env.production
    networks:
      - rustrevive_internal_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rustrevive_internal_net:
    external: true
